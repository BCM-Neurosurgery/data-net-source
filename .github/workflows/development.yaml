# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  basics:
    runs-on: [self-hosted,testing,generic]
    env:
      env_name: 'temp-env'
      conda: conda run --name temp-env
    steps:
      - run: |
          groups
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          env_name: $env_name
      - name: Install dependencies
        run: |
          $conda conda info
          $conda  pip install flake8 pytest
        shell: bash -ileo pipefail {0}
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
           $conda flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
           $conda  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        shell: bash -ileo pipefail {0}

  try-checkers: # Run the complete throughput test with each checker
    needs: basics
    strategy:
      matrix:
        checker: [FileCheckerMixin]
    runs-on: [self-hosted,testing,generic]
    env:
      config_path: "placeholder/path"
      conda-run: conda run --name temp-env
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - name: Assemble a parser config for this checker
        run: $conda python tests/make_config.py checker ${{ matrix.checker }}
      - name: Prepare an individual source parser
        run: $conda python prepare.py $config_path
      - name: Run the trial parser
        run: $conda python run.py $config_path
