# ============================================================
# Auto-generated config for fifth
# Mode: listen
# ============================================================

[parser]

[parser.class]
type = "dynamic"
name = "fifth"
parts = [
  ["listeners.watchdog_listener", "WatchdogListenerMixin"],
  ["uploaders.local_to_s3", "S3UploaderMixin"],
]

[parser.init]
state_path = "path/to/state/directory"

[parser.init.source]
path = "path/to/monitor"
include_patterns = ['.*\\.csv$', '.*\\.txt$']
exclude_patterns = ['.*\\.tmp$']
batch_max_size = 10
batch_max_latency_seconds = 60
recursive = true

[parser.init.target]
bucket = "target-bucket-name"
prefix = "raw_data/"
allow-overwrite = true

# Logging configuration
[logging.file]
filepath = "path/to/log/file.log"
level = 0
max_size = 21048576
max_files = 5

[dependencies]
pip = [
  "boto3",
  "watchdog",
]