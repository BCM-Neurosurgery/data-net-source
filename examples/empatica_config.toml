[parser.class]
type = "dynamic"
name = "EmpaticaParser"
parts = [
  ["checkers.api.empatica", "EmpaticaAPICheckerMixin"],
  ["uploaders.simple", "CopyUploaderMixin"]
]

[parser.init]
state_path = "/home/wearables-lead/.local/state/data-net-source/empatica"

[parser.init.source]
s3_uri = "s3://empatica-bucket/v2/ORG/STUDY/SITE/"
# Private JSON containing aws_access_key_id and aws_secret_access_key.
empatica_config = "/home/settings/TRBD-53761/empatica_config.json"
region = "us-east-1"
path = "/home/wearables-lead/.cache/data-net-source/empatica"
# Optional first recording day, inclusive. Omit to import the entire S3 history.
# start_date = 2026-11-01

[parser.init.target]
# Set this to the existing root for TRBD patient folders.
# Exports go to <path>/TRBD005/empatica/YYYY-MM-DD/<filename>.
path = "/path/to/approved/study"
allow-overwrite = true

[logging.file]
level = 20
max_size = 10485760
max_files = 5

[dependencies]
pip = ["boto3", "numpy"]
